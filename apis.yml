name: SHRAPNEL
description: 'SHRAPNEL is a AAA free-to-play extraction first-person shooter developed by
  Neon Machine and built on a dedicated Avalanche blockchain subnet. Early access launched
  on PC in February 2024, with a Steam listing and a player-driven economy: modding and
  creator tools for building skins and maps, a marketplace for tradable in-game items, and
  the SHRAP token. Neon Machine has publicly announced a Web3 developer API platform named
  GameBridge, but as of this profile it is not yet publicly documented — SHRAPNEL exposes
  no public developer API, SDK, OpenAPI, or docs portal, and shrapnel.com sits behind
  Cloudflare bot protection. Surfaced as a portfolio company of Polychain and tracked in the
  API Evangelist network.'
